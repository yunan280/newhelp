# ch02/ch03 的 MySQL。宿主端口取 .env 的 MYSQL_PORT，默认 3307，避开本机 MySQL 的 3306。
# 只绑定回环地址；账号密码取自 .env 的 MYSQL_*。
services:
  mysql:
    image: mysql:8.0
    container_name: mewhelp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mewhelp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mewhelp-mysql-data:
