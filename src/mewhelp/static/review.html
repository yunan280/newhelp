<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MewHelp · 知识审核</title><link rel="stylesheet" href="/static/ch09.css"></head><body>
<header><strong>🐱 MewHelp 客服后台</strong><nav><a href="/review" aria-current="page">知识审核</a><a href="/ch09/stats">用量与评估</a><a href="/">聊天页</a></nav></header>
<main><h1>让下一次回答更准确</h1><p class="muted">先对照用户原话与召回证据，再补充核准答案。示例草稿仅供参考。</p><div id="notice" class="notice" role="status"></div>
<section class="panel"><div class="toolbar"><h2>知识缺口</h2><label>状态<select id="status"><option>待审</option><option>通过</option><option>驳回</option><option>全部</option></select></label><label>排序<select id="sort"><option value="occurrence">出现次数优先</option><option value="created">最近新增优先</option></select></label><button id="refresh">刷新队列</button></div><p id="total" class="muted"></p><div id="queue"></div><div class="pagination"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></section>
<section class="panel"><h2>尚未归并的问题</h2><p id="pending" class="muted">正在读取…</p><div id="worker"></div></section></main><script src="/static/ch09-common.js"></script><script>
let page=1,total=0,loading=false;
const queue=document.getElementById('queue');
async function load(){if(loading)return;loading=true;document.getElementById('refresh').disabled=true;try{
 const data=await api('/reviews?'+new URLSearchParams({status:document.getElementById('status').value,sort:document.getElementById('sort').value,page,page_size:10}));total=data.total;queue.replaceChildren();
 document.getElementById('total').textContent='共 '+total+' 个知识缺口';for(const row of data.items)renderRow(row);if(!data.items.length)queue.append(el('p','当前筛选下没有问题。','muted'));
 document.getElementById('page').textContent='第 '+page+' / '+Math.max(1,Math.ceil(total/10))+' 页';document.getElementById('prev').disabled=page===1;document.getElementById('next').disabled=page*10>=total;
 await workerStatus();
 }catch(error){notice(error.message,true)}finally{loading=false;document.getElementById('refresh').disabled=false}}
function renderRow(row){const details=el('details',null,'review'),summary=el('summary');summary.append(el('span',row.normalized_question,'question'),el('span',row.occurrence_count+' 次','count'),el('span',publication(row.publication_status)||row.review_status,'tag'));summary.append(el('span','示例草稿：'+(row.ai_suggested_answer||'待人工补充'),'summary-draft'));details.append(summary);const body=el('div',null,'detail');details.append(body);let loaded=false;details.addEventListener('toggle',async()=>{if(!details.open||loaded)return;try{await detail(row.id,body,1);loaded=true}catch(error){body.replaceChildren(el('p',error.message,'error'))}});queue.append(details)}
async function detail(id,body,originPage){const row=await api('/reviews/'+id+'?page='+originPage+'&page_size=10');body.parentElement.querySelector('summary .tag').textContent=publication(row.publication_status)||row.review_status;body.replaceChildren(el('p','首次入队：'+localTime(row.created_at)+' · 缺口 #'+row.id,'muted'),el('h3','示例草稿（仅供参考）'),el('div',row.ai_suggested_answer||'待人工补充','pre'));
 const origins=el('div');body.append(el('h3','归并的用户原话'),origins);for(const raw of row.originals.items){const item=el('div',null,'origin');item.append(el('div',raw.original_question,'pre'),el('p','入口：'+raw.entry_point+' · '+raw.trigger_stage+' · '+localTime(raw.created_at),'muted small'),el('p',raw.reason||'', 'muted'));const snapshot=raw.retrieved_chunks;if(!snapshot)item.append(el('p','本轮明确未走检索。','muted'));else{item.append(el('p','证据状态：'+snapshot.state+(snapshot.reason?' · '+snapshot.reason:''),'muted small'));if(snapshot.confidence)item.append(el('p','证据置信度：'+JSON.stringify(snapshot.confidence),'muted small'));for(const chunk of snapshot.chunks||[]){const block=el('div',null,'chunk');block.append(el('div','Top '+chunk.rank+' · 相关性 '+(chunk.relevance_score==null?'未保留评分':chunk.relevance_score.toFixed(4))+' · 来源 #'+chunk.chunk_id,'muted small'),el('div',chunk.text,'pre'));item.append(block)}}origins.append(item)}
 const pager=el('div',null,'pagination');for(const [name,p]of [['更早原话',originPage-1],['后续原话',originPage+1]]){const button=el('button',name);button.disabled=p<1||p>Math.ceil(row.originals.total/10);button.onclick=()=>detail(id,body,p).catch(e=>notice(e.message,true));pager.append(button)}pager.append(el('span',row.originals.total+' 条原话 / 第 '+originPage+' 页','small muted'));body.append(pager);
 if(row.review_status==='待审'){const form=el('form');form.append(el('h3','填写核准答案'));const label=el('label','核准答案（必填，不会自动采用AI草稿）','stack'),answer=el('textarea');answer.required=true;answer.maxLength=16000;answer.setAttribute('aria-label','核准答案');label.append(answer);form.append(label);const fields=el('div',null,'two'),catLabel=el('label','分类','stack'),category=el('input');category.value='客服补充FAQ';category.required=true;category.maxLength=255;catLabel.append(category);const modelLabel=el('label','产品型号（可选）','stack'),model=el('input');model.maxLength=128;modelLabel.append(model);fields.append(catLabel,modelLabel);form.append(fields);const controls=el('div',null,'controls'),approve=el('button','核准并发布','primary'),reject=el('button','驳回','danger');approve.type='submit';reject.type='button';controls.append(approve,reject);form.append(controls);form.onsubmit=async e=>{e.preventDefault();if(!answer.value.trim()){answer.focus();return}approve.disabled=reject.disabled=true;try{const result=await api('/reviews/'+id+'/approve',{approved_answer:answer.value.trim(),category:category.value.trim(),product_category:model.value.trim()||null});notice(publication(result.publication_status)+' · 知识 #'+result.knowledge_id+(result.sync_error?'；'+result.sync_error:''),Boolean(result.sync_error));await detail(id,body,originPage)}catch(error){notice(error.message,true)}finally{approve.disabled=reject.disabled=false}};reject.onclick=async()=>{if(!window.confirm('驳回这个知识缺口？'))return;approve.disabled=reject.disabled=true;try{await api('/reviews/'+id+'/reject',{});notice('已驳回缺口 #'+id);await detail(id,body,originPage)}catch(error){notice(error.message,true)}finally{approve.disabled=reject.disabled=false}};body.append(form)
 }else{body.append(el('h3',row.review_status==='通过'?'核准答案':'已驳回'));if(row.approved_answer)body.append(el('div',row.approved_answer,'pre'));if(row.review_status==='通过'){const controls=el('div',null,'controls'),retry=el('button',row.publication_status==='pending'?'重试发布':'核对发布状态');retry.onclick=async()=>{retry.disabled=true;try{const result=await api('/reviews/'+id+'/publish',{});notice(publication(result.publication_status)+(result.sync_error?'；'+result.sync_error:''),Boolean(result.sync_error));await detail(id,body,originPage)}catch(error){notice(error.message,true)}finally{retry.disabled=false}};controls.append(el('span',publication(row.publication_status),'tag'),retry);body.append(controls)}}}
async function workerStatus(){const state=await api('/flywheel/status');document.getElementById('pending').textContent=state.scan_error?'读取积压失败：'+state.scan_error:'等待标准化与查重：'+state.pending_count+' 条。'+state.diagnostics_scope;const body=document.getElementById('worker');body.replaceChildren();for(const[id,item]of Object.entries(state.attempts||{})){if(!item.error&&item.state!=='manual_retry')continue;const line=el('div',null,'controls');line.append(el('span','原话 #'+id+' · '+(item.error||item.state),'error'));const retry=el('button','重试归并');retry.onclick=async()=>{retry.disabled=true;try{await api('/flywheel/retry/'+id,{});notice('已安排原话 #'+id+' 重新归并');await workerStatus()}catch(e){notice(e.message,true)}finally{retry.disabled=false}};line.append(retry);body.append(line)}}
document.getElementById('refresh').onclick=load;for(const id of['status','sort'])document.getElementById(id).onchange=()=>{page=1;load()};document.getElementById('prev').onclick=()=>{page--;load()};document.getElementById('next').onclick=()=>{page++;load()};load();
</script></body></html>
