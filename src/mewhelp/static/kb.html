<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知识库录入 · MewHelp</title>
  <style>
    :root { --bg:#fff8f3; --panel:#fff; --text:#3d2b1f; --muted:#8c7465; --line:#ebdcd1; --brand:#ff6b35; --brand-dark:#e8551f; --green:#16834b; --red:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--text); background:radial-gradient(800px 400px at 50% -200px,#ffe6d6,transparent 80%),var(--bg); font:15px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
    button,input,textarea,select { font:inherit; }
    button { cursor:pointer; } button:disabled { opacity:.55; cursor:wait; }
    header { background:#fff; border-bottom:1px solid var(--line); }
    .bar { max-width:1180px; margin:auto; padding:15px 24px; display:flex; align-items:center; gap:12px; }
    .mark { width:36px; height:36px; border-radius:11px; display:grid; place-items:center; color:#fff; font-weight:800; background:linear-gradient(145deg,var(--brand),var(--brand-dark)); }
    .brand { font-size:17px; font-weight:750; } nav { margin-left:auto; display:flex; gap:18px; } nav a { color:var(--muted); text-decoration:none; font-size:14px; } nav a:hover { color:var(--brand-dark); }
    main { max-width:1180px; margin:auto; padding:42px 24px 80px; }
    .eyebrow { color:var(--brand-dark); font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:8px 0 9px; font-size:clamp(28px,4vw,39px); line-height:1.2; letter-spacing:-.04em; }
    .intro { margin:0; color:var(--muted); max-width:700px; }
    .layout { display:grid; grid-template-columns:minmax(320px,420px) minmax(0,1fr); gap:22px; align-items:start; margin-top:32px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:26px; box-shadow:0 12px 34px rgba(89,47,22,.07); }
    h2 { margin:0; font-size:19px; } .sub { color:var(--muted); font-size:13px; margin:5px 0 23px; }
    .field { display:block; margin:17px 0; } .field-name { display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:7px; } .hint { color:var(--muted); font-size:12px; font-weight:400; }
    .field input,.field textarea,.field select { display:block; width:100%; min-width:0; border:1px solid var(--line); border-radius:10px; padding:10px 12px; color:var(--text); background:#fff; outline:none; }
    .field textarea { min-height:78px; resize:vertical; } .field textarea[name="answer"] { min-height:136px; }
    .field input:focus,.field textarea:focus,.field select:focus { border-color:var(--brand); box-shadow:0 0 0 3px #fff0e7; }
    .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .check { display:flex; align-items:center; gap:9px; font-size:13px; margin:4px 0 22px; } .check input { accent-color:var(--brand); width:16px; height:16px; }
    .primary { width:100%; border:0; border-radius:10px; background:var(--brand); color:#fff; font-weight:750; padding:11px 16px; } .primary:hover { background:var(--brand-dark); }
    #form-message { min-height:21px; font-size:13px; margin:11px 0 0; color:var(--muted); } .error { color:var(--red)!important; } .success { color:var(--green)!important; }
    .head { display:flex; justify-content:space-between; align-items:start; gap:16px; } .refresh,.retry { border:1px solid var(--line); color:var(--text); border-radius:9px; background:#fff; padding:7px 11px; font-size:13px; }
    .refresh:hover,.retry:hover { border-color:var(--brand); color:var(--brand-dark); } .counts { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:17px; } .count { background:#f9f5f1; border-radius:999px; padding:4px 10px; font-size:12px; color:var(--muted); }
    .entries { display:grid; gap:11px; } .entry { border:1px solid var(--line); border-radius:13px; padding:16px; } .entry-top { display:flex; justify-content:space-between; gap:10px; }
    .entry h3 { margin:0; font-size:15px; overflow-wrap:anywhere; } .badge { white-space:nowrap; border-radius:999px; padding:3px 9px; font-size:11px; font-weight:700; } .badge.done { color:var(--green); background:#eaf8ef; } .badge.pending { color:#9c6100; background:#fff5da; }
    .entry p { margin:8px 0; color:#695448; font-size:13px; white-space:pre-wrap; overflow-wrap:anywhere; } .entry-meta { display:flex; flex-wrap:wrap; gap:7px; color:var(--muted); font-size:12px; } .entry-meta span+span::before { content:"·"; margin-right:7px; }
    .retry { margin-top:12px; font-weight:700; } .empty { padding:36px 16px; text-align:center; border:1px dashed var(--line); border-radius:12px; color:var(--muted); } #list-message { font-size:13px; }
    @media(max-width:820px) { .layout { grid-template-columns:1fr; } main { padding-top:30px; } }
    @media(max-width:480px) { main { padding-left:14px; padding-right:14px; } .bar { padding:12px 14px; } .panel { padding:20px; } .two { grid-template-columns:1fr; gap:0; } }
  </style>
</head>
<body>
  <header><div class="bar"><div class="mark" aria-hidden="true">M</div><div class="brand">MewHelp</div><nav><a href="/">客服对话</a><a href="/kb" aria-current="page">知识库</a></nav></div></header>
  <main>
    <div class="eyebrow">Knowledge base</div>
    <h1>知识库录入</h1>
    <p class="intro">把核实过的答案写进知识库。保存后会尝试向量化；若服务暂不可用，原文会保留为待处理，可在右侧重试。</p>
    <div class="layout">
      <section class="panel" aria-labelledby="editor-title">
        <h2 id="editor-title">新增知识</h2><p class="sub">分类、问法和答案会一起用于语义检索。</p>
        <form id="entry-form">
          <label class="field"><span class="field-name">分类 <span class="hint">必填</span></span><input name="category" maxlength="255" placeholder="例如：物流 / 运费" required></label>
          <label class="field"><span class="field-name">问法或章节标题 <span class="hint">必填，可每行一个问法</span></span><textarea name="questions" maxlength="16000" placeholder="例如：邮费是多少？&#10;运费怎么计算？" required></textarea></label>
          <label class="field"><span class="field-name">答案 <span class="hint">必填</span></span><textarea name="answer" maxlength="16000" placeholder="写下准确、可直接用于回复的内容" required></textarea></label>
          <div class="two">
            <label class="field"><span class="field-name">内容类型</span><select name="content_type"><option value="faq">商品 FAQ</option><option value="policy">政策</option><option value="manual">售后手册</option></select></label>
            <label class="field"><span class="field-name">章节路径 <span class="hint">可选</span></span><input name="section_path" maxlength="512" placeholder="例如：配送 / 运费"></label>
          </div>
          <label class="check"><input type="checkbox" name="is_key_clause"> 标记为关键条款</label>
          <button class="primary" id="save-button" type="submit">保存并向量化</button>
          <p id="form-message" role="status" aria-live="polite"></p>
        </form>
      </section>
      <section class="panel" aria-labelledby="library-title">
        <div class="head"><div><h2 id="library-title">最近知识</h2><p class="sub">显示最近 50 条及其向量化状态。</p></div><button class="refresh" type="button" id="refresh-button">刷新</button></div>
        <div class="counts" id="counts"></div><p id="list-message" role="status" aria-live="polite"></p>
        <div class="entries" id="entries"><div class="empty">正在加载知识…</div></div>
      </section>
    </div>
  </main>
  <script>
    const form = document.getElementById('entry-form');
    const entries = document.getElementById('entries');
    const counts = document.getElementById('counts');
    const formMessage = document.getElementById('form-message');
    const listMessage = document.getElementById('list-message');
    const saveButton = document.getElementById('save-button');
    let entryId = crypto.randomUUID();

    function message(el, text, kind = '') { el.textContent = text; el.className = kind; }
    async function request(path, options) {
      const response = await fetch(path, options);
      const body = await response.json();
      if (!response.ok) throw new Error(response.status === 422 ? '请检查必填项和字段长度。' : (body.detail || `请求失败 (${response.status})`));
      return body;
    }
    function renderEntries(rows) {
      entries.replaceChildren(); counts.replaceChildren();
      const done = rows.filter(row => row.vectorize_status === 'done').length;
      for (const label of [`最近 ${rows.length} 条`, `已向量化 ${done}`, `待处理 ${rows.length - done}`]) {
        const pill = document.createElement('span'); pill.className = 'count'; pill.textContent = label; counts.append(pill);
      }
      if (!rows.length) {
        const empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = '还没有知识，先录入第一条。'; entries.append(empty); return;
      }
      for (const row of rows) {
        const card = document.createElement('article'); card.className = 'entry';
        const top = document.createElement('div'); top.className = 'entry-top';
        const title = document.createElement('h3'); title.textContent = row.questions.split('\n')[0];
        const badge = document.createElement('span'); badge.className = `badge ${row.vectorize_status}`; badge.textContent = row.vectorize_status === 'done' ? '已向量化' : '待向量化';
        top.append(title, badge);
        const answer = document.createElement('p'); answer.textContent = row.answer.length > 180 ? `${row.answer.slice(0, 180)}…` : row.answer;
        const meta = document.createElement('div'); meta.className = 'entry-meta';
        for (const value of [row.category, row.content_type, row.section_path].filter(Boolean)) { const item = document.createElement('span'); item.textContent = value; meta.append(item); }
        card.append(top, answer, meta);
        if (row.vectorize_status === 'pending') {
          const retry = document.createElement('button'); retry.type = 'button'; retry.className = 'retry'; retry.textContent = '重试向量化';
          retry.addEventListener('click', async () => {
            retry.disabled = true; retry.textContent = '正在向量化…';
            try {
              const result = await request(`/api/kb/entries/${row.id}/sync`, { method:'POST' });
              message(listMessage, result.sync_error || '向量化完成。', result.sync_error ? 'error' : 'success');
              await loadEntries();
            } catch (error) { message(listMessage, error.message, 'error'); retry.disabled = false; retry.textContent = '重试向量化'; }
          });
          card.append(retry);
        }
        entries.append(card);
      }
    }
    async function loadEntries() {
      try { renderEntries(await request('/api/kb/entries')); }
      catch (error) { message(listMessage, `读取知识失败：${error.message}`, 'error'); }
    }
    form.addEventListener('submit', async event => {
      event.preventDefault(); if (!form.reportValidity()) return;
      const data = new FormData(form);
      const payload = { entry_id:entryId, category:data.get('category'), questions:data.get('questions'), answer:data.get('answer'), section_path:data.get('section_path') || null, content_type:data.get('content_type'), is_key_clause:data.has('is_key_clause') };
      saveButton.disabled = true; saveButton.textContent = '正在保存并向量化…';
      message(formMessage, '首次加载 BGE-M3 可能需要几十秒，请稍候。');
      try {
        const result = await request('/api/kb/entries', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(payload) });
        message(formMessage, result.sync_error || '已保存并向量化，可以被客服检索。', result.sync_error ? 'error' : 'success');
        form.reset(); entryId = crypto.randomUUID(); await loadEntries();
      } catch (error) { message(formMessage, error.message, 'error'); }
      finally { saveButton.disabled = false; saveButton.textContent = '保存并向量化'; }
    });
    document.getElementById('refresh-button').addEventListener('click', loadEntries);
    loadEntries();
  </script>
</body>
</html>
