<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MewHelp 商城 · 智能客服</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fff8f3;
    --glow: #ffe9dc;
    --panel: #ffffff;
    --line: #f2e3d8;
    --line-strong: #e8d3c4;
    --text: #3d2b1f;
    --muted: #9a8375;
    --brand: #ff6b35;
    --brand-deep: #e8551f;
    --brand-soft: #fff1e9;
    --ai-bg: #ffffff;
    --err: #d92d20;
    --err-bg: #fef3f2;
    --shadow: 0 1px 2px rgba(61, 43, 31, .04), 0 8px 24px rgba(61, 43, 31, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #1a1310;
      --glow: #2a1a12;
      --panel: #241a15;
      --line: #3a2a22;
      --line-strong: #4d382d;
      --text: #f5eae2;
      --muted: #b39b8c;
      --brand: #ff7a45;
      --brand-deep: #ff6b35;
      --brand-soft: #33211a;
      --ai-bg: #241a15;
      --err: #ff9b85;
      --err-bg: #3a1e18;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .28);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(900px 340px at 50% -140px, var(--glow), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 15px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 品牌栏 ─────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(61, 43, 31, .02);
  }
  .logo {
    flex: none;
    width: 38px; height: 38px;
    display: grid; place-items: center;
    font-size: 20px;
    border-radius: 12px;
    background: linear-gradient(140deg, var(--brand), var(--brand-deep));
    box-shadow: 0 4px 12px rgba(255, 107, 53, .3);
  }
  .titles { flex: 1; min-width: 0; }
  header h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .01em; }
  .sub {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
  }
  .pulse {
    width: 7px; height: 7px; border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 3px rgba(34, 197, 94, .16);
  }
  .human {
    flex: none;
    padding: 7px 14px;
    font: inherit; font-size: 13px;
    color: var(--brand-deep);
    background: var(--brand-soft);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    cursor: pointer;
  }
  .human:hover { border-color: var(--brand); }
  .human:disabled { opacity: .5; cursor: default; }

  /* ── 消息区 ─────────────────────────────────────────────── */
  #log {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 24px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .wrap { max-width: 760px; width: 100%; margin: 0 auto; }

  .row { display: flex; gap: 9px; align-items: flex-end; }
  .row.me { flex-direction: row-reverse; }

  .avatar {
    flex: none;
    width: 30px; height: 30px;
    display: grid; place-items: center;
    font-size: 15px;
    border-radius: 10px;
    background: var(--brand-soft);
    border: 1px solid var(--line);
  }

  .bubble {
    max-width: min(78%, 520px);
    padding: 10px 14px;
    border-radius: 18px;
    white-space: pre-wrap;
    word-break: break-word;
    animation: rise .18s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  .me .bubble {
    background: linear-gradient(140deg, var(--brand), var(--brand-deep));
    color: #fff;
    border-bottom-right-radius: 6px;
    box-shadow: 0 3px 12px rgba(255, 107, 53, .22);
  }
  .ai .bubble {
    background: var(--ai-bg);
    border: 1px solid var(--line);
    border-bottom-left-radius: 6px;
    box-shadow: var(--shadow);
  }
  .ai .bubble.err { color: var(--err); background: var(--err-bg); border-color: currentColor; }
  .ai .bubble.err::before { content: '⚠ '; }

  /* 气泡里是**两个**节点:tools 专放工具徽章,text 专放正文。
     分开是必须的 —— 正文是边流边 `+=` 上去的，而撤掉等待动画用的是
     `textContent = ''`，那会把子节点一并抹掉；徽章挂在同一个节点上就会被抹没。
     (徽章还可能**晚于首字**到达:turn1 的正文本来就是边流边吐的 —— 所以它是插在
     正文之上的，绝不能反过来重置已经渲染的文本。) */
  .bubble .tools { display: flex; flex-direction: column; gap: 6px; }
  .bubble .tools:empty { display: none; }
  .bubble .tools:not(:empty) { margin-bottom: 8px; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    align-self: flex-start;
    padding: 3px 10px;
    font-size: 12px; line-height: 1.6;
    color: var(--brand-deep);
    background: var(--brand-soft);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
  }
  .badge .spin {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--brand);
    animation: breath 1.2s ease-in-out infinite;
  }
  /* 跑完就降调，"已发生"不该抢正文的注意力;失败则升调 —— 那是用户要知道的。 */
  .badge.done { color: var(--muted); background: var(--bg); }
  .badge.fail { color: var(--err); background: var(--err-bg); border-color: currentColor; }

  /* 流式光标:靠 `::after` 加一个方块,不碰 textContent 里累积的正文。
     `content` 只设静态值、动画只动 `opacity` —— 同 .dots 的理由,见下。
     挂在 .text 上而不是 .bubble 上:气泡里现在多了 tools 那一层，`.bubble` 的
     `::after` 会落到整个气泡块的末尾(也就是徽章下面)，光标就跑错位置了。 */
  .bubble .text.streaming::after {
    content: '';
    display: inline-block;
    width: 2px; height: 1em;
    margin-left: 3px;
    vertical-align: -2px;
    background: currentColor;
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* 等第一个 token 的静默期,让"在等"和"卡住"看得出来。
     两件事必须同时成立,缺一个就等于没有:
     1. 三个点是**静态**的 DOM 元素 —— 任何浏览器里都看得见东西,不会是空气泡;
     2. "在动"只靠 `opacity` + `transform` 的错峰呼吸。
     不要用 `@keyframes` 逐帧改 `content`('' → '.' → '..'):`content` 在 CSS 里是
     discrete-animation 属性,支持面不均匀 —— 一旦不生效,首 token 前那 ~1 秒里
     用户看到的就是一个完全空的气泡,而"让这段静默可见"正是它存在的全部理由。 */
  .dots { display: inline-flex; gap: 4px; align-items: center; height: 1.2em; }
  .dots i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: breath 1.2s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: .18s; }
  .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes breath {
    0%, 100% { opacity: .25; transform: translateY(0); }
    50%      { opacity: 1;   transform: translateY(-2px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .dots i, .bubble .text.streaming::after, .badge .spin, .bubble { animation: none; }
    .dots i, .badge .spin { opacity: .6; }
  }

  .hint {
    align-self: center;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    max-width: 460px;
    padding: 6px 0;
  }
  .hint b { color: var(--brand-deep); font-weight: 600; }

  /* ── 快捷问题 ───────────────────────────────────────────── */
  #chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 0 20px 10px;
  }
  #chips button {
    padding: 6px 13px;
    font: inherit; font-size: 13px;
    color: var(--brand-deep);
    background: var(--panel);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  #chips button:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand); }
  #chips button:disabled { opacity: .45; cursor: default; }

  /* ── 输入栏 ─────────────────────────────────────────────── */
  form {
    display: flex;
    gap: 10px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 12px 20px 16px;
    border-top: 1px solid var(--line);
    background: var(--panel);
  }
  input {
    flex: 1;
    min-width: 0;
    padding: 11px 16px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(255, 107, 53, .14);
  }
  input:disabled { opacity: .6; }
  form button {
    flex: none;
    padding: 11px 24px;
    font: inherit; font-weight: 550;
    color: #fff;
    background: linear-gradient(140deg, var(--brand), var(--brand-deep));
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(255, 107, 53, .28);
  }
  form button:disabled { opacity: .45; cursor: default; box-shadow: none; }

  /* 窄屏:气泡吃满宽度,快捷问题横滑 */
  @media (max-width: 520px) {
    header { padding: 10px 14px; }
    #log { padding: 16px 14px 6px; }
    .bubble { max-width: 86%; }
    #chips { padding: 0 14px 10px; flex-wrap: nowrap; overflow-x: auto; }
    #chips button { flex: none; }
    form { padding: 10px 14px 14px; }
    form button { padding: 11px 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🐱</div>
  <div class="titles">
    <h1>MewHelp 商城</h1>
    <div class="sub"><span class="pulse"></span>智能客服在线</div>
  </div>
  <button id="human" class="human" type="button">转人工</button>
</header>

<div id="log"><div class="hint">
  你好~ 我是 MewHelp 的智能客服。发货、售后、退换货都可以问我。<br>
  <span style="font-size:12px">第 2 章 · 工具调用演示（气泡上的徽章就是这次调的工具）</span>
</div></div>

<div id="chips">
  <button type="button" data-q="订单 1001 的物流到哪了">订单 1001 的物流到哪了</button>
  <button type="button" data-q="退货政策是什么">退货政策是什么</button>
  <button type="button" data-q="邮费是多少">邮费是多少</button>
  <button type="button" data-q="降噪耳机多少钱">降噪耳机多少钱</button>
</div>

<form id="f">
  <input id="q" autocomplete="off" placeholder="说点什么…" autofocus>
  <button id="send" type="submit">发送</button>
</form>

<script>
const log = document.getElementById('log');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');
const chipsEl = document.getElementById('chips');
const humanBtn = document.getElementById('human');

// session_id 存 sessionStorage:刷新页面还能接着上一轮聊。
// 用 sessionStorage 而不是 localStorage —— 关掉标签页就换一个新会话,符合"客服"的直觉;
// 服务端重启后这个 id 会指向一个空历史,表现是"它忘了",重开一个即可。
//
// 但 sessionStorage **不是一定可用**:隐私模式、站点数据被阻止时,访问它是**抛异常**
// 而不是返回 null。两处访问的代价各不相同,都得接住:
//   读 —— 在脚本顶层,抛出去整个页面的 JS 就不再有下文(连输入框都按不动);
//   写 —— 在流处理里,抛出去会被外层 catch 误判成"连接中断"。
// 读不到就当"没有会话 id"(服务端会发一个新的),写不进去只丢掉"刷新续聊"这个便利。
const SESSION_KEY = 'mewhelp_session_id';

function readStoredSessionId() {
  try { return sessionStorage.getItem(SESSION_KEY); } catch (e) { return null; }
}

function storeSessionId(id) {
  try { sessionStorage.setItem(SESSION_KEY, id); } catch (e) { /* 存不下不影响这一轮对话 */ }
}

let sessionId = readStoredSessionId();

// user_id 存 localStorage，和 session_id 的存储分开 —— 两者生命周期不同:
// 会话是"关掉标签页就换一个"，而用户身份要跨会话稳定(工单的归属人就是它)。
// 同样接住异常(隐私模式、站点数据被阻止时访问是**抛异常**)，
// 拿不到就退回一个固定的匿名标识 —— 服务端还有兜底默认值。
const USER_KEY = 'mewhelp_user_id';

function readOrCreateUserId() {
  try {
    const kept = localStorage.getItem(USER_KEY);
    if (kept) return kept;
    const fresh = 'web-' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem(USER_KEY, fresh);
    return fresh;
  } catch (e) {
    return 'web-anon';
  }
}

const userId = readOrCreateUserId();

// 返回气泡的三个把手:整体、徽章容器、正文容器。
// AI 气泡的两者必须分开(理由见 CSS 里 `.bubble .tools` 那段);用户气泡没有徽章，
// 两个把手都指向气泡本身，调用方因此不必分支。
function bubble(who, text) {
  const row = document.createElement('div');
  row.className = 'wrap';
  const inner = document.createElement('div');
  inner.className = 'row ' + who;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = who === 'ai' ? '🐱' : '🙋';

  const b = document.createElement('div');
  b.className = 'bubble';

  let tools = b;
  let body = b;
  if (who === 'ai') {
    tools = document.createElement('div');
    tools.className = 'tools';
    body = document.createElement('div');
    body.className = 'text';
    b.append(tools, body);
  }
  body.textContent = text;

  inner.append(avatar, b);
  row.appendChild(inner);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return { bubble: b, tools, text: body };
}

// 系统提示行(会话丢失之类)。刻意不做成消息气泡 —— 它不是对话的一方说的话。
function note(text) {
  const el = document.createElement('div');
  el.className = 'hint';
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

// SSE 一个事件一个块,块之间空行分隔;行尾可能是 \n 也可能是 \r\n。
// 按"找到完整分隔符"切,而不是 split('\n\n') —— 后者遇到 \r\n\r\n 会切不开。
const SEP = /\r?\n\r?\n/;

function parseBlock(block) {
  let event = 'message';
  const dataLines = [];
  for (const rawLine of block.split(/\r?\n/)) {
    if (rawLine.startsWith(':')) continue;              // 注释行(心跳 / 保活)
    if (rawLine.startsWith('event:')) event = rawLine.slice(6).trim();
    else if (rawLine.startsWith('data:')) dataLines.push(rawLine.slice(5).replace(/^ /, ''));
  }
  return { event: event, data: dataLines.join('\n') };
}

const ERROR_LABEL = { empty_completion: '模型没答上来', upstream_error: '上游出错' };

// 工具名 → 人话。没列到的直接显示原名:多一个新工具时页面不会瞎猜一个中文名。
// (服务端的工具名是英文契约，这个映射是纯粹的展示层。)
const TOOL_LABEL = {
  query_order: '查订单',
  query_product: '查商品',
  query_logistics: '查物流',
  query_faq: '查 FAQ',
  create_ticket: '建工单',
};

// 三个点必须是真 DOM 节点,不能靠 CSS 的 `content` 逐帧变 —— 理由见上面 .dots 的注释。
function makeDots() {
  const d = document.createElement('span');
  d.className = 'dots';
  d.append(document.createElement('i'), document.createElement('i'), document.createElement('i'));
  return d;
}

async function send(text) {
  bubble('me', text);
  const reply = bubble('ai', '');
  reply.text.appendChild(makeDots());
  // 发出去之前本地有没有会话 id —— 用来判断 session 帧的 resumed=false 该不该提示。
  // 首次发言时本地本来就没有，服务端新建一个，那不是"丢了历史"。
  const hadLocalSession = Boolean(sessionId);
  // 工具名 → 这个工具名下**还没收尾**的徽章队列。用队列而不是单值：一轮里同一个工具
  // 可以被调两次（「订单 1001 和 1002 的物流到哪了」→ 两个 query_logistics）。
  // 按名字只存一个节点的话，第二个 start 会覆盖第一个，第一个徽章就永远转圈了。
  //
  // 先进先出凭什么对：服务端先按调用顺序发**全部** start，再按**同一个顺序**发全部 end
  // （ch02/service.py 的 _prepare_turn_events，run_all 保序），所以同名的那几个 start
  // 与 end 一一对应。这条顺序由 tests/test_ch02_service_stream.py 的两个用例钉住。
  const badges = new Map();
  let started = false;
  let gotAnything = false;

  // 第一个 token 到达:撤掉等待动画、换上流式光标。
  // 早于第一个 token 挂光标会出现"三个点 + 光标"并存的怪相,所以放在这里。
  const start = () => {
    if (started) return;
    started = true;
    reply.text.textContent = '';       // 设置 textContent 会把子节点(那三个点)一并移除
    reply.text.classList.add('streaming');
  };

  // 工具跑的这段时间里正文区**保留**那三个点:撤掉的话那一两秒就是个空气泡,
  // 看着像卡住 —— 而这段时间恰恰是本页最需要"看得见在动"的一段。
  const startBadge = (payload) => {
    const el = document.createElement('span');
    el.className = 'badge';
    const spin = document.createElement('span');
    spin.className = 'spin';
    const name = document.createElement('span');
    name.textContent = '🔧 ' + (TOOL_LABEL[payload.name] || payload.name);
    el.append(spin, name);
    reply.tools.appendChild(el);
    const queue = badges.get(payload.name);
    if (queue) queue.push(el);
    else badges.set(payload.name, [el]);
    log.scrollTop = log.scrollHeight;
  };

  const finishBadge = (payload) => {
    const queue = badges.get(payload.name);
    // 先 start 的先收尾，与服务端发 end 的顺序一致
    const el = queue && queue.length ? queue.shift() : null;
    // 这个名字收完了就整个删掉（留个空数组在 Map 里没有意义）
    if (queue && queue.length === 0) badges.delete(payload.name);
    if (!el) return;                 // 没收到 start(理论上不会):宁可不补，也不挂个孤儿徽章
    el.className = 'badge ' + (payload.ok ? 'done' : 'fail');
    const spin = el.querySelector('.spin');
    if (spin) spin.remove();
    const tail = document.createElement('span');
    tail.textContent = payload.ok
      ? '✓ ' + Math.round(payload.elapsed_ms) + ' ms'
      : '✗ ' + (payload.error || '失败');
    el.appendChild(tail);
    log.scrollTop = log.scrollHeight;
  };

  const handle = ({ event, data }) => {
    if (!data) return;
    let payload;
    try {
      payload = JSON.parse(data);
    } catch (e) {
      return;   // 解析不了的块(心跳之类)忽略掉,不能让它把整条流打断
    }

    if (event === 'session') {
      sessionId = payload.session_id;
      storeSessionId(sessionId);
      if (hadLocalSession && payload.resumed === false) {
        note('服务端没有这段会话的记录，下面是一段新对话。');
      }
    } else if (event === 'tool') {
      // 不碰正文、也不撤等待动画 —— 见 startBadge 上面的注释。
      if (payload.phase === 'end') finishBadge(payload);
      else startBadge(payload);
    } else if (event === 'token') {
      if (!started) start();
      reply.text.textContent += payload.text;
      gotAnything = true;
      log.scrollTop = log.scrollHeight;
    } else if (event === 'error') {
      // 服务端契约:这一轮**没有**写进会话历史,重发同一条消息即可重试,不用换会话。
      if (!started) start();
      reply.text.classList.remove('streaming');
      reply.bubble.classList.add('err');
      reply.text.textContent += (gotAnything ? '\n\n' : '')
        + '[' + (ERROR_LABEL[payload.code] || '出错') + '] ' + payload.message;
    }
  };

  try {
    const resp = await fetch('/ch02/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // session_id 可能是 null —— **不能**把它换成空串:服务端那条"空白一律 422"的
      // 规则对空串同样生效。null 表示"我还没有会话"，服务端会发一个新的。
      body: JSON.stringify({ session_id: sessionId, user_id: userId, message: text }),
    });

    if (!resp.ok) {
      // 参数不合法走的是普通 JSON 错误(422 + detail),不是 SSE —— 这层得单独接住。
      let detail = resp.status + ' ' + resp.statusText;
      try {
        const body = await resp.json();
        if (body.detail) detail = JSON.stringify(body.detail);
      } catch (e) { /* 不是 JSON 就退回状态码 */ }
      reply.text.classList.remove('streaming');
      reply.bubble.classList.add('err');
      reply.text.textContent = '[请求被拒] ' + detail;
      return;
    }

    // 必须 fetch + getReader(),不能用 EventSource —— EventSource 只发 GET,这接口是 POST。
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let carry = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      carry += decoder.decode(value, { stream: true });

      let m;
      while ((m = SEP.exec(carry)) !== null) {
        const block = carry.slice(0, m.index);
        carry = carry.slice(m.index + m[0].length);
        if (block.trim()) handle(parseBlock(block));
      }
    }

    carry += decoder.decode();
    if (carry.trim()) handle(parseBlock(carry));   // 最后一块可能没有结尾空行
  } catch (err) {
    // 响应头都没拿到(服务没起、断网),或读流中途断开。这一轮没写进历史,重发即可。
    reply.text.classList.remove('streaming');
    reply.bubble.classList.add('err');
    reply.text.textContent += (gotAnything ? '\n\n' : '') + '[连接中断] ' + err.message;
  } finally {
    reply.text.classList.remove('streaming');
    // 判空只看正文 —— 徽章不算答复。工具调了但一个字没吐，仍然是"空回复"。
    if (!reply.text.textContent) reply.text.textContent = '[空回复]';
  }
}

// 唯一的入口。表单、快捷问题、转人工都走这里 —— 所以"正在发送"的互斥也只需要在这里做。
// (之前的版本靠 `input.disabled` 顺带挡住重复提交,那是偶然的;快捷按钮一加就不成立了。)
let busy = false;
const allButtons = () => [sendBtn, humanBtn, ...chipsEl.querySelectorAll('button')];

async function submit(text) {
  if (busy || !text) return;
  busy = true;
  input.disabled = true;
  allButtons().forEach((b) => { b.disabled = true; });
  try {
    await send(text);
  } finally {
    busy = false;
    input.disabled = false;
    allButtons().forEach((b) => { b.disabled = false; });
    input.focus();
  }
}

document.getElementById('f').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  submit(text);
});

chipsEl.addEventListener('click', (e) => {
  const q = e.target.dataset && e.target.dataset.q;
  if (q) submit(q);
});

humanBtn.addEventListener('click', () => submit('我要转人工'));
</script>
