<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MewHelp 商城 · 智能客服</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fff8f3;
    --glow: #ffe9dc;
    --panel: #ffffff;
    --line: #f2e3d8;
    --line-strong: #e8d3c4;
    --text: #3d2b1f;
    --muted: #9a8375;
    --brand: #ff6b35;
    --brand-deep: #e8551f;
    --brand-soft: #fff1e9;
    --ai-bg: #ffffff;
    --err: #d92d20;
    --err-bg: #fef3f2;
    --shadow: 0 1px 2px rgba(61, 43, 31, .04), 0 8px 24px rgba(61, 43, 31, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #1a1310;
      --glow: #2a1a12;
      --panel: #241a15;
      --line: #3a2a22;
      --line-strong: #4d382d;
      --text: #f5eae2;
      --muted: #b39b8c;
      --brand: #ff7a45;
      --brand-deep: #ff6b35;
      --brand-soft: #33211a;
      --ai-bg: #241a15;
      --err: #ff9b85;
      --err-bg: #3a1e18;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .28);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(900px 340px at 50% -140px, var(--glow), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 15px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 品牌栏 ─────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(61, 43, 31, .02);
  }
  .logo {
    flex: none;
    width: 38px; height: 38px;
    display: grid; place-items: center;
    font-size: 20px;
    border-radius: 12px;
    background: linear-gradient(140deg, var(--brand), var(--brand-deep));
    box-shadow: 0 4px 12px rgba(255, 107, 53, .3);
  }
  .titles { flex: 1; min-width: 0; }
  header h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .01em; }
  .sub {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
  }
  .pulse {
    width: 7px; height: 7px; border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 3px rgba(34, 197, 94, .16);
  }
  .human {
    flex: none;
    padding: 7px 14px;
    font: inherit; font-size: 13px;
    color: var(--brand-deep);
    background: var(--brand-soft);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    cursor: pointer;
  }
  .human:hover { border-color: var(--brand); }
  .human:disabled { opacity: .5; cursor: default; }

  /* ── 消息区 ─────────────────────────────────────────────── */
  #log {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 24px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .wrap { max-width: 760px; width: 100%; margin: 0 auto; }

  .row { display: flex; gap: 9px; align-items: flex-end; }
  .row.me { flex-direction: row-reverse; }

  .avatar {
    flex: none;
    width: 30px; height: 30px;
    display: grid; place-items: center;
    font-size: 15px;
    border-radius: 10px;
    background: var(--brand-soft);
    border: 1px solid var(--line);
  }

  .bubble {
    max-width: min(78%, 520px);
    padding: 10px 14px;
    border-radius: 18px;
    white-space: pre-wrap;
    word-break: break-word;
    animation: rise .18s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  .me .bubble {
    background: linear-gradient(140deg, var(--brand), var(--brand-deep));
    color: #fff;
    border-bottom-right-radius: 6px;
    box-shadow: 0 3px 12px rgba(255, 107, 53, .22);
  }
  .ai .bubble {
    background: var(--ai-bg);
    border: 1px solid var(--line);
    border-bottom-left-radius: 6px;
    box-shadow: var(--shadow);
  }
  .ai .bubble.err { color: var(--err); background: var(--err-bg); border-color: currentColor; }
  .ai .bubble.err::before { content: '⚠ '; }

  /* 流式光标:靠 `::after` 加一个方块,不碰 textContent 里累积的正文。
     `content` 只设静态值、动画只动 `opacity` —— 同 .dots 的理由,见下。 */
  .bubble.streaming::after {
    content: '';
    display: inline-block;
    width: 2px; height: 1em;
    margin-left: 3px;
    vertical-align: -2px;
    background: currentColor;
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* 等第一个 token 的静默期,让"在等"和"卡住"看得出来。
     两件事必须同时成立,缺一个就等于没有:
     1. 三个点是**静态**的 DOM 元素 —— 任何浏览器里都看得见东西,不会是空气泡;
     2. "在动"只靠 `opacity` + `transform` 的错峰呼吸。
     不要用 `@keyframes` 逐帧改 `content`('' → '.' → '..'):`content` 在 CSS 里是
     discrete-animation 属性,支持面不均匀 —— 一旦不生效,首 token 前那 ~1 秒里
     用户看到的就是一个完全空的气泡,而"让这段静默可见"正是它存在的全部理由。 */
  .dots { display: inline-flex; gap: 4px; align-items: center; height: 1.2em; }
  .dots i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: breath 1.2s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: .18s; }
  .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes breath {
    0%, 100% { opacity: .25; transform: translateY(0); }
    50%      { opacity: 1;   transform: translateY(-2px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .dots i, .bubble.streaming::after, .bubble { animation: none; }
    .dots i { opacity: .6; }
  }

  .hint {
    align-self: center;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    max-width: 460px;
    padding: 6px 0;
  }
  .hint b { color: var(--brand-deep); font-weight: 600; }

  /* ── 快捷问题 ───────────────────────────────────────────── */
  #chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 0 20px 10px;
  }
  #chips button {
    padding: 6px 13px;
    font: inherit; font-size: 13px;
    color: var(--brand-deep);
    background: var(--panel);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  #chips button:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand); }
  #chips button:disabled { opacity: .45; cursor: default; }

  /* ── 输入栏 ─────────────────────────────────────────────── */
  form {
    display: flex;
    gap: 10px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 12px 20px 16px;
    border-top: 1px solid var(--line);
    background: var(--panel);
  }
  input {
    flex: 1;
    min-width: 0;
    padding: 11px 16px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(255, 107, 53, .14);
  }
  input:disabled { opacity: .6; }
  form button {
    flex: none;
    padding: 11px 24px;
    font: inherit; font-weight: 550;
    color: #fff;
    background: linear-gradient(140deg, var(--brand), var(--brand-deep));
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(255, 107, 53, .28);
  }
  form button:disabled { opacity: .45; cursor: default; box-shadow: none; }

  /* 窄屏:气泡吃满宽度,快捷问题横滑 */
  @media (max-width: 520px) {
    header { padding: 10px 14px; }
    #log { padding: 16px 14px 6px; }
    .bubble { max-width: 86%; }
    #chips { padding: 0 14px 10px; flex-wrap: nowrap; overflow-x: auto; }
    #chips button { flex: none; }
    form { padding: 10px 14px 14px; }
    form button { padding: 11px 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🐱</div>
  <div class="titles">
    <h1>MewHelp 商城</h1>
    <div class="sub"><span class="pulse"></span>智能客服在线</div>
  </div>
  <button id="human" class="human" type="button">转人工</button>
</header>

<div id="log"><div class="hint">
  你好~ 我是 MewHelp 的智能客服。发货、售后、退换货都可以问我。<br>
  <span style="font-size:12px">第 1 章 · 纯对话演示</span>
</div></div>

<div id="chips">
  <button type="button" data-q="我的快递到哪了?">我的快递到哪了?</button>
  <button type="button" data-q="我想退货,鞋码买大了">我想退货,鞋码买大了</button>
  <button type="button" data-q="我要改收货地址">我要改收货地址</button>
</div>

<form id="f">
  <input id="q" autocomplete="off" placeholder="说点什么…" autofocus>
  <button id="send" type="submit">发送</button>
</form>

<script>
const log = document.getElementById('log');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');
const chipsEl = document.getElementById('chips');
const humanBtn = document.getElementById('human');

// session_id 存 sessionStorage:刷新页面还能接着上一轮聊。
// 用 sessionStorage 而不是 localStorage —— 关掉标签页就换一个新会话,符合"客服"的直觉;
// 服务端重启后这个 id 会指向一个空历史,表现是"它忘了",重开一个即可。
//
// 但 sessionStorage **不是一定可用**:隐私模式、站点数据被阻止时,访问它是**抛异常**
// 而不是返回 null。两处访问的代价各不相同,都得接住:
//   读 —— 在脚本顶层,抛出去整个页面的 JS 就不再有下文(连输入框都按不动);
//   写 —— 在流处理里,抛出去会被外层 catch 误判成"连接中断"。
// 读不到就当"没有会话 id"(服务端会发一个新的),写不进去只丢掉"刷新续聊"这个便利。
const SESSION_KEY = 'mewhelp_session_id';

function readStoredSessionId() {
  try { return sessionStorage.getItem(SESSION_KEY); } catch (e) { return null; }
}

function storeSessionId(id) {
  try { sessionStorage.setItem(SESSION_KEY, id); } catch (e) { /* 存不下不影响这一轮对话 */ }
}

let sessionId = readStoredSessionId();

function bubble(who, text) {
  const row = document.createElement('div');
  row.className = 'wrap';
  const inner = document.createElement('div');
  inner.className = 'row ' + who;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = who === 'ai' ? '🐱' : '🙋';

  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;

  inner.append(avatar, b);
  row.appendChild(inner);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

// SSE 一个事件一个块,块之间空行分隔;行尾可能是 \n 也可能是 \r\n。
// 按"找到完整分隔符"切,而不是 split('\n\n') —— 后者遇到 \r\n\r\n 会切不开。
const SEP = /\r?\n\r?\n/;

function parseBlock(block) {
  let event = 'message';
  const dataLines = [];
  for (const rawLine of block.split(/\r?\n/)) {
    if (rawLine.startsWith(':')) continue;              // 注释行(心跳 / 保活)
    if (rawLine.startsWith('event:')) event = rawLine.slice(6).trim();
    else if (rawLine.startsWith('data:')) dataLines.push(rawLine.slice(5).replace(/^ /, ''));
  }
  return { event: event, data: dataLines.join('\n') };
}

const ERROR_LABEL = { empty_completion: '模型没答上来', upstream_error: '上游出错' };

// 三个点必须是真 DOM 节点,不能靠 CSS 的 `content` 逐帧变 —— 理由见上面 .dots 的注释。
function makeDots() {
  const d = document.createElement('span');
  d.className = 'dots';
  d.append(document.createElement('i'), document.createElement('i'), document.createElement('i'));
  return d;
}

async function send(text) {
  bubble('me', text);
  const reply = bubble('ai', '');
  reply.appendChild(makeDots());
  let started = false;
  let gotAnything = false;

  // 第一个 token 到达:撤掉等待动画、换上流式光标。
  // 早于第一个 token 挂光标会出现"三个点 + 光标"并存的怪相,所以放在这里。
  const start = () => {
    if (started) return;
    started = true;
    reply.textContent = '';            // 设置 textContent 会把子节点(那三个点)一并移除
    reply.classList.add('streaming');
  };

  const handle = ({ event, data }) => {
    if (!data) return;
    let payload;
    try {
      payload = JSON.parse(data);
    } catch (e) {
      return;   // 解析不了的块(心跳之类)忽略掉,不能让它把整条流打断
    }

    if (event === 'session') {
      sessionId = payload.session_id;
      storeSessionId(sessionId);
    } else if (event === 'token') {
      if (!started) start();
      reply.textContent += payload.text;
      gotAnything = true;
      log.scrollTop = log.scrollHeight;
    } else if (event === 'error') {
      // 服务端契约:这一轮**没有**写进会话历史,重发同一条消息即可重试,不用换会话。
      if (!started) start();
      reply.classList.remove('streaming');
      reply.classList.add('err');
      reply.textContent += (gotAnything ? '\n\n' : '')
        + '[' + (ERROR_LABEL[payload.code] || '出错') + '] ' + payload.message;
    }
  };

  try {
    const resp = await fetch('/ch01/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });

    if (!resp.ok) {
      // 参数不合法走的是普通 JSON 错误(422 + detail),不是 SSE —— 这层得单独接住。
      let detail = resp.status + ' ' + resp.statusText;
      try {
        const body = await resp.json();
        if (body.detail) detail = JSON.stringify(body.detail);
      } catch (e) { /* 不是 JSON 就退回状态码 */ }
      reply.classList.remove('streaming');
      reply.classList.add('err');
      reply.textContent = '[请求被拒] ' + detail;
      return;
    }

    // 必须 fetch + getReader(),不能用 EventSource —— EventSource 只发 GET,这接口是 POST。
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let carry = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      carry += decoder.decode(value, { stream: true });

      let m;
      while ((m = SEP.exec(carry)) !== null) {
        const block = carry.slice(0, m.index);
        carry = carry.slice(m.index + m[0].length);
        if (block.trim()) handle(parseBlock(block));
      }
    }

    carry += decoder.decode();
    if (carry.trim()) handle(parseBlock(carry));   // 最后一块可能没有结尾空行
  } catch (err) {
    // 响应头都没拿到(服务没起、断网),或读流中途断开。这一轮没写进历史,重发即可。
    reply.classList.remove('streaming');
    reply.classList.add('err');
    reply.textContent += (gotAnything ? '\n\n' : '') + '[连接中断] ' + err.message;
  } finally {
    reply.classList.remove('streaming');
    if (!reply.textContent) reply.textContent = '[空回复]';
  }
}

// 唯一的入口。表单、快捷问题、转人工都走这里 —— 所以"正在发送"的互斥也只需要在这里做。
// (之前的版本靠 `input.disabled` 顺带挡住重复提交,那是偶然的;快捷按钮一加就不成立了。)
let busy = false;
const allButtons = () => [sendBtn, humanBtn, ...chipsEl.querySelectorAll('button')];

async function submit(text) {
  if (busy || !text) return;
  busy = true;
  input.disabled = true;
  allButtons().forEach((b) => { b.disabled = true; });
  try {
    await send(text);
  } finally {
    busy = false;
    input.disabled = false;
    allButtons().forEach((b) => { b.disabled = false; });
    input.focus();
  }
}

document.getElementById('f').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  submit(text);
});

chipsEl.addEventListener('click', (e) => {
  const q = e.target.dataset && e.target.dataset.q;
  if (q) submit(q);
});

humanBtn.addEventListener('click', () => submit('我要转人工'));
</script>
</body>
</html>
