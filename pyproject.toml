[project]
name = "mewhelp"
version = "0.1.0"
description = "电商 AI 智能客服 - Agent 应用开发实战"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.9",
    "pydantic-settings>=2.15",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "httpx>=0.27",
    "langchain-core>=1.6",
    "langchain-openai>=1.6",
]

[project.optional-dependencies]
tools = [
    "mcp==1.30.0",
    "langchain-mcp-adapters==0.3.2",
    "jsonschema==4.26.0",
]
# 按章节逐步启用,学一章装一章
agent = [
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite==3.1.1",
]
rag = [
    "pymilvus>=2.6,<2.7",
    "sentence-transformers>=3.0,<4",
    "sentencepiece>=0.2",
]
observability = [
    "langfuse==4.17.0",
    "langchain==1.4.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not eval'"
markers = [
    "eval: 需要真实调用上游模型的评估,默认不跑,用 pytest -m eval 手动触发",
]
