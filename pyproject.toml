[project]
name = "mewhelp"
version = "0.1.0"
description = "电商 AI 智能客服 - Agent 应用开发实战"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 按章节逐步启用,学一章装一章
agent = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
]
rag = [
    "pymilvus>=2.4",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2",
]
observability = [
    "langfuse>=2.50",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
